<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-gray-100 min-h-screen font-sans">
    <a href="#conteudo" class="skip-link">Pular para o conteúdo</a>

    <header>
      <div class="w-full max-w-[1440px] p-4 m-auto">
        <div
          class="flex justify-between items-center bg-red-600 rounded-full h-16 py-2 px-6 m-auto max-w-2xl relative z-50 border-4 border-black shadow-[0_4px_0_0_rgba(0,0,0,1)]"
        >
          <h1>
            <a
              href="/"
              class="text-white font-pokemon text-xl tracking-widest drop-shadow-md"
              >POKÉDEX</a
            >
          </h1>

          <button
            type="button"
            aria-label="Abrir Menu"
            aria-expanded="false"
            aria-controls="navegacao-primaria"
            id="btn-menu"
            class="h-10 w-10 text-3xl cursor-pointer text-white md:hidden hover:text-gray-200 transition-colors"
          >
            <i
              class="bi bi-list flex items-center justify-center"
              aria-hidden="true"
            ></i>
          </button>

          <nav
            id="navegacao-primaria"
            aria-label="Menu principal"
            class="hidden md:block"
          >
            <ul class="flex flex-col gap-6 md:flex-row">
              <li>
                <a
                  href="#"
                  class="text-white font-bold hover:text-black transition-colors uppercase text-sm tracking-wider"
                  >Início</a
                >
              </li>
              <li>
                <a
                  href="#"
                  class="text-white font-bold hover:text-black transition-colors uppercase text-sm tracking-wider"
                  >Missões</a
                >
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <main
      id="conteudo"
      class="flex flex-col gap-10 py-10 px-4 max-w-4xl mx-auto"
    >
      <section class="pokemon-section">
        <article
          class="pokedex-card bg-red-600 border-4 border-black rounded-3xl p-6 shadow-[8px_8px_0_0_rgba(0,0,0,1)] relative overflow-hidden"
        >
          <div class="absolute top-4 left-4 flex gap-2">
            <div
              class="w-8 h-8 rounded-full bg-blue-500 border-2 border-white shadow-inner"
            ></div>
            <div
              class="w-4 h-4 rounded-full bg-red-500 border border-black mt-1"
            ></div>
            <div
              class="w-4 h-4 rounded-full bg-yellow-400 border border-black mt-1"
            ></div>
            <div
              class="w-4 h-4 rounded-full bg-green-500 border border-black mt-1"
            ></div>
          </div>

          <header class="text-center mt-12 mb-6">
            <h2 class="font-pokemon text-white text-2xl drop-shadow-md">
              Buscar Pokémon
            </h2>
          </header>

          <form
            id="pokemon-form"
            class="flex flex-col sm:flex-row gap-4 bg-gray-200 p-4 rounded-xl border-4 border-black"
          >
            <label for="pokemon-input" class="sr-only">Nome do pokémon</label>
            <input
              type="text"
              id="pokemon-input"
              placeholder="Ex: pikachu"
              autocomplete="off"
              class="flex-1 rounded-lg border-2 border-black bg-white text-black outline-none focus:border-red-600 p-3 font-bold placeholder-gray-400 uppercase font-mono"
            />
            <button
              type="submit"
              class="bg-black text-white px-6 py-3 font-bold rounded-lg border-2 border-transparent hover:bg-gray-800 transition-colors uppercase"
            >
              Buscar
            </button>
          </form>

          <div id="pokemon-resultado-container" class="mt-6 hidden">
            <!-- Resultado injetado via JS -->
          </div>
        </article>
      </section>

      <section class="todo-section">
        <article
          class="pokedex-card bg-white border-4 border-black rounded-3xl p-6 shadow-[8px_8px_0_0_rgba(0,0,0,1)] relative"
        >
          <div
            class="absolute -top-4 right-8 w-16 h-8 bg-red-600 border-4 border-b-0 border-black rounded-t-full"
          ></div>

          <header class="text-center mb-6">
            <h2 class="font-pokemon text-black text-2xl">Missões (To-Do)</h2>
          </header>

          <form class="todo-form flex gap-2" id="todo-form">
            <label for="tarefa" class="sr-only">Nova Missão</label>
            <input
              type="text"
              placeholder="Adicionar nova missão..."
              id="tarefa"
              autocomplete="off"
              class="flex-1 rounded-lg border-2 border-black bg-gray-100 text-black outline-none focus:border-red-600 p-3 font-bold"
            />
            <button
              type="submit"
              class="bg-red-600 text-white px-6 font-bold rounded-lg border-2 border-black hover:bg-red-700 transition-colors uppercase"
            >
              +
            </button>
          </form>

          <ul
            class="todo-list mt-6 flex flex-col gap-3 max-h-64 overflow-y-auto pr-2 custom-scrollbar"
            id="todo-list"
          ></ul>
        </article>
      </section>
    </main>

    <script src="./js/menu-hamburguer.js"></script>
    <script src="./js/todo-list.js"></script>
    <script src="./js/pokemon-api.js"></script>
  </body>
</html>
